<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RPS Arena — Rock Paper Scissors</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col items-center justify-between p-4 sm:p-6 selection:bg-indigo-500 selection:text-white">

  <!-- Header -->
  <header class="w-full max-w-3xl flex flex-wrap items-center justify-between gap-4 glass-panel rounded-2xl px-5 py-4">
    <div class="flex items-center gap-3">
      <span class="text-2xl">🎮</span>
      <div>
        <h1 class="text-lg sm:text-xl font-bold tracking-tight bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">
          RPS ARENA
        </h1>
        <p class="text-xs text-slate-400">Arcade Edition</p>
      </div>
    </div>

    <!-- Mode Selector -->
    <div class="flex items-center gap-1 bg-slate-900/80 p-1 rounded-xl border border-slate-800" id="mode-selector">
      <button data-mode="endless" class="mode-btn active px-3 py-1.5 rounded-lg text-xs font-semibold transition">Endless</button>
      <button data-mode="bo3" class="mode-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition">Best of 3</button>
      <button data-mode="bo5" class="mode-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition">Best of 5</button>
    </div>

    <!-- Controls -->
    <div class="flex items-center gap-2">
      <button id="sound-toggle" title="Toggle Sound" class="p-2.5 rounded-xl bg-slate-900/80 hover:bg-slate-800 border border-slate-800 text-slate-300 transition">
        🔊
      </button>
      <button id="reset-btn" title="Reset Match" class="px-3 py-2 rounded-xl bg-slate-900/80 hover:bg-rose-950/60 hover:border-rose-500/40 hover:text-rose-300 border border-slate-800 text-xs font-semibold text-slate-300 transition">
        Reset
      </button>
    </div>
  </header>

  <!-- Main Game Area -->
  <main class="w-full max-w-3xl flex flex-col gap-6 my-auto py-6">

    <!-- Scoreboard -->
    <section class="grid grid-cols-3 gap-3 sm:gap-4">
      <div class="glass-panel rounded-2xl p-4 text-center">
        <p class="text-xs uppercase tracking-wider text-indigo-400 font-semibold">You</p>
        <p id="player-score" class="text-3xl sm:text-4xl font-extrabold mt-1">0</p>
      </div>
      <div class="glass-panel rounded-2xl p-4 text-center flex flex-col justify-center">
        <p class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Streak</p>
        <p id="streak-count" class="text-2xl sm:text-3xl font-bold text-amber-400 mt-1">0 🔥</p>
        <p id="ties-count" class="text-[11px] text-slate-500 mt-0.5">Ties: 0</p>
      </div>
      <div class="glass-panel rounded-2xl p-4 text-center">
        <p class="text-xs uppercase tracking-wider text-pink-400 font-semibold">CPU</p>
        <p id="cpu-score" class="text-3xl sm:text-4xl font-extrabold mt-1">0</p>
      </div>
    </section>

    <!-- Battle Arena -->
    <section class="glass-panel rounded-3xl p-6 sm:p-10 relative overflow-hidden">
      <div id="status-banner" class="text-center mb-6">
        <span id="status-text" class="inline-block px-4 py-1.5 rounded-full text-sm font-semibold bg-slate-900/90 border border-slate-700/70 text-slate-200">
          Choose your weapon below!
        </span>
      </div>

      <div class="grid grid-cols-3 items-center gap-2 sm:gap-6 my-4">
        <!-- Player Fighter -->
        <div class="flex flex-col items-center gap-3">
          <div id="player-hand-box" class="w-24 h-24 sm:w-32 sm:h-32 rounded-3xl bg-slate-900/80 border-2 border-slate-800 flex items-center justify-center text-5xl sm:text-6xl transition-all duration-300">
            <span id="player-hand">✊</span>
          </div>
          <span class="text-xs font-medium text-slate-400">Player</span>
        </div>

        <!-- VS Divider -->
        <div class="flex flex-col items-center justify-center">
          <span class="text-xl sm:text-2xl font-black tracking-widest text-slate-600">VS</span>
        </div>

        <!-- CPU Fighter -->
        <div class="flex flex-col items-center gap-3">
          <div id="cpu-hand-box" class="w-24 h-24 sm:w-32 sm:h-32 rounded-3xl bg-slate-900/80 border-2 border-slate-800 flex items-center justify-center text-5xl sm:text-6xl transition-all duration-300">
            <span id="cpu-hand" class="scale-x-[-1] inline-block">✊</span>
          </div>
          <span class="text-xs font-medium text-slate-400">Computer</span>
        </div>
      </div>

      <!-- Weapon Controls -->
      <div class="grid grid-cols-3 gap-3 sm:gap-4 mt-8" id="choice-buttons">
        <button data-choice="rock" class="choice-btn group flex flex-col items-center gap-2 p-4 rounded-2xl bg-slate-900/90 hover:bg-indigo-950/60 border border-slate-800 hover:border-indigo-500/60 transition-all active:scale-95">
          <span class="text-3xl sm:text-4xl group-hover:scale-110 transition-transform">🪨</span>
          <span class="text-xs sm:text-sm font-semibold">Rock</span>
          <kbd class="text-[10px] text-slate-500 bg-slate-950 px-1.5 py-0.5 rounded border border-slate-800">R</kbd>
        </button>

        <button data-choice="paper" class="choice-btn group flex flex-col items-center gap-2 p-4 rounded-2xl bg-slate-900/90 hover:bg-indigo-950/60 border border-slate-800 hover:border-indigo-500/60 transition-all active:scale-95">
          <span class="text-3xl sm:text-4xl group-hover:scale-110 transition-transform">📄</span>
          <span class="text-xs sm:text-sm font-semibold">Paper</span>
          <kbd class="text-[10px] text-slate-500 bg-slate-950 px-1.5 py-0.5 rounded border border-slate-800">P</kbd>
        </button>

        <button data-choice="scissors" class="choice-btn group flex flex-col items-center gap-2 p-4 rounded-2xl bg-slate-900/90 hover:bg-indigo-950/60 border border-slate-800 hover:border-indigo-500/60 transition-all active:scale-95">
          <span class="text-3xl sm:text-4xl group-hover:scale-110 transition-transform">✂️</span>
          <span class="text-xs sm:text-sm font-semibold">Scissors</span>
          <kbd class="text-[10px] text-slate-500 bg-slate-950 px-1.5 py-0.5 rounded border border-slate-800">S</kbd>
        </button>
      </div>
    </section>

    <!-- Match History -->
    <section class="glass-panel rounded-2xl p-4">
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Recent Rounds</h2>
        <span id="round-counter" class="text-xs text-slate-500">0 played</span>
      </div>
      <div id="history-list" class="flex gap-2 overflow-x-auto pb-1 min-h-[36px] items-center text-xs text-slate-500">
        <span>No rounds played yet.</span>
      </div>
    </section>
  </main>

  <!-- Match Over Modal -->
  <div id="victory-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="glass-panel max-w-sm w-full rounded-3xl p-8 text-center border border-slate-700/80 shadow-2xl">
      <div id="modal-emoji" class="text-6xl mb-4">🏆</div>
      <h2 id="modal-title" class="text-2xl font-extrabold mb-2">Victory!</h2>
      <p id="modal-subtitle" class="text-sm text-slate-400 mb-6">You defeated the CPU 2 - 1.</p>
      <button id="play-again-btn" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-semibold text-white transition shadow-lg shadow-indigo-500/25">
        Play Again
      </button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
